apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-asset-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: it-asset-management
  template:
    metadata:
      labels:
        app: it-asset-management
    spec:
      containers:
        - name: web
          image: it-asset-management:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: it-asset-management-service
spec:
  type: NodePort
  selector:
    app: it-asset-management
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080
